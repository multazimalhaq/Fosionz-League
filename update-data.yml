name: Update FPL data

on:
  schedule:
    # Every 15 minutes. Edit this cron if you want it more/less frequent.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest FPL data
        run: node scripts/fetch-data.mjs

      - name: Commit data.json if it changed
        run: |
          git config user.name "fpl-league-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update FPL data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
